name: CI

# NOTE: deliberately no `paths-ignore: '**/*.md'` here, unlike the sibling tool
# repos. In a plugin repo Markdown IS the product — skills/<name>/SKILL.md is
# executable content, so skipping CI on .md changes would skip CI on the code.
on:
  push:
    branches: [main]
    # Tag builds are the only place the "Tag matches shipped version" check can
    # run. Without this the check is dead code — which is how a v0.1.0 that
    # nobody could install got published. Tags are per plugin (`census-v0.3.1`);
    # the retired repo-wide `v0.3.0` form stays in history but is never rebuilt.
    tags: ['*-v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace
        run: claude plugin validate .

      - name: Validate each plugin
        run: |
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            plugin_dir="$(dirname "$(dirname "$manifest")")"
            echo "--- $plugin_dir"
            claude plugin validate "$plugin_dir"
          done

  consistency:
    name: Version and skill consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Marketplace entry version matches plugin.json
        # The version users actually receive is the marketplace entry's. If it
        # drifts from the plugin's own manifest, the wrong version ships
        # silently — `claude plugin validate` only warns about this.
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          root = market.get("metadata", {}).get("pluginRoot", ".")
          failures = []

          for entry in market["plugins"]:
              source = entry["source"]
              if not isinstance(source, str):
                  continue  # remote source; nothing local to compare against
              path = (pathlib.Path(root) / source).resolve()
              manifest = path / ".claude-plugin" / "plugin.json"
              if not manifest.is_file():
                  failures.append(f"{entry['name']}: no plugin.json at {manifest}")
                  continue
              plugin = json.loads(manifest.read_text())
              if entry.get("version") != plugin.get("version"):
                  failures.append(
                      f"{entry['name']}: marketplace={entry.get('version')!r} "
                      f"!= plugin.json={plugin.get('version')!r}"
                  )
              if entry["name"] != plugin.get("name"):
                  failures.append(
                      f"{entry['name']}: marketplace name != plugin.json name "
                      f"{plugin.get('name')!r}"
                  )

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY

      - name: Tag matches shipped version
        # Only meaningful on a tag build; a mismatch here means the release
        # would publish a version nobody can install. The tag names WHICH plugin
        # is being released, so only that one is checked — the others are
        # deliberately at different versions and must not be dragged along.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          ref = os.environ["GITHUB_REF_NAME"]
          plugin, sep, version = ref.rpartition("-v")
          if not sep:
              print(f"FAIL: tag {ref!r} is not of the form <plugin>-v<X.Y.Z>")
              sys.exit(1)

          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          entry = next((e for e in market["plugins"] if e["name"] == plugin), None)
          if entry is None:
              known = ", ".join(e["name"] for e in market["plugins"])
              print(f"FAIL: tag names plugin {plugin!r}, which is not in the marketplace ({known})")
              sys.exit(1)

          if entry.get("version") != version:
              print(f"FAIL: tag {ref} ships {plugin} {version}, "
                    f"but the marketplace entry says {entry.get('version')!r}")
              sys.exit(1)
          print(f"PASS: {plugin} {version} matches the marketplace entry")
          PY

      - name: Every skill and agent declares a description
        # The description is the only thing Claude routes on. A skill or agent
        # without one ships as dead weight: installed, listed, never reached.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          plugins = pathlib.Path("plugins")
          # A command is invoked by its FILENAME, so it needs no `name:` field.
          # A skill and an agent are both addressed by a declared name.
          targets = (
              [(p, True) for p in sorted(plugins.glob("*/skills/*/SKILL.md"))]
              + [(p, True) for p in sorted(plugins.glob("*/agents/*.md"))]
              + [(p, False) for p in sorted(plugins.glob("*/commands/*.md"))]
          )
          if not targets:
              print("FAIL: nothing found — the globs are wrong")
              sys.exit(1)

          failures = []
          for target, needs_name in targets:
              text = target.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  failures.append(f"{target}: no frontmatter")
                  continue
              block = text.split("---", 2)[1]
              if not re.search(r"^description:\s*\S", block, re.M):
                  failures.append(f"{target}: no description in frontmatter")
              if needs_name and not re.search(r"^name:\s*\S", block, re.M):
                  failures.append(f"{target}: no name in frontmatter")

          print(f"checked {len(targets)} items")
          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY

      - name: Every plugin hook resolves to an executable script
        # A hook is a pointer, and its worst failure is that the target is not
        # there: the registration ships, the hook never fires, and nothing says
        # so. This is the exact defect census reports for a user's own config —
        # it would be poor form to ship it from here.
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          # Built at runtime, never written literally: a doubled brace in this
          # file is read by GitHub Actions as an expression before the step ever
          # runs, and an unknown one makes the whole workflow invalid.
          PLUGIN_ROOT = "${" + "CLAUDE_PLUGIN_ROOT}"

          failures = []
          manifests = sorted(pathlib.Path("plugins").glob("*/hooks/hooks.json"))
          for manifest in manifests:
              root = manifest.parent.parent
              try:
                  data = json.loads(manifest.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  failures.append(f"{manifest}: invalid JSON ({exc})")
                  continue
              for event, entries in (data.get("hooks") or {}).items():
                  for entry in entries:
                      for hook in entry.get("hooks", []):
                          command = hook.get("command", "")
                          if "${CLAUDE_PLUGIN_ROOT}" not in command:
                              failures.append(
                                  f"{manifest}: {event} command is not rooted at "
                                  f"{PLUGIN_ROOT}: {command!r}"
                              )
                              continue
                          rel = command.split("${CLAUDE_PLUGIN_ROOT}/", 1)[1].split()[0]
                          target = root / rel
                          if not target.is_file():
                              failures.append(f"{manifest}: {event} points at a missing {target}")
                          elif not os.access(target, os.X_OK):
                              failures.append(f"{manifest}: {target} is not executable")

          print(f"checked {len(manifests)} hook manifest(s)")
          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY

  scripts:
    name: Bundled scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Byte-compile
        run: python3 -m compileall -q plugins

      - name: census smoke test
        # Builds a throwaway config tree, scans it, and asserts census finds
        # exactly what was planted. Guards the collector against silent
        # regressions in discovery or frontmatter parsing.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/agents" \
                   "$fixture/home/.claude/skills/demo" \
                   "$fixture/repo/.claude/commands"
          printf -- '---\nname: alpha\ndescription: an agent\n---\nbody\n' \
            > "$fixture/home/.claude/agents/alpha.md"
          printf -- '---\nname: demo\ndescription: a skill\n---\nbody\n' \
            > "$fixture/home/.claude/skills/demo/SKILL.md"
          printf -- '---\ndescription: a command\n---\nbody\n' \
            > "$fixture/repo/.claude/commands/beta.md"
          cat > "$fixture/census.json" <<EOF
          {
            "userRoots": ["$fixture/home/.claude"],
            "projectRoots": ["$fixture/repo"],
            "excludeOssForks": false
          }
          EOF

          out="$(python3 plugins/census/scripts/census.py --config "$fixture/census.json" catalog)"
          echo "$out"

          for expected in "1 agents" "1 commands" "1 skills" '`alpha`' '`beta`' '`demo`'; do
            if ! grep -qF -- "$expected" <<<"$out"; then
              echo "FAIL: expected '$expected' in catalog output"
              exit 1
            fi
          done
          echo "PASS: census discovered the planted fixture"

      - name: census refuses to write into a scanned tree
        # The README promises the tool never writes into a tree it scans. That
        # promise is only real if the refusal is exercised.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/agents"
          printf -- '---\nname: alpha\ndescription: an agent\n---\nbody\n' \
            > "$fixture/home/.claude/agents/alpha.md"
          cat > "$fixture/census.json" <<EOF
          {
            "userRoots": ["$fixture/home/.claude"],
            "projectRoots": [],
            "excludeOssForks": false
          }
          EOF

          if python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
               catalog --out "$fixture/home/.claude/CENSUS.md"; then
            echo "FAIL: wrote a report inside the scanned config root"
            exit 1
          fi
          if [ -e "$fixture/home/.claude/CENSUS.md" ]; then
            echo "FAIL: refused but the file exists anyway"
            exit 1
          fi
          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            catalog --out "$fixture/outside.md"
          test -s "$fixture/outside.md"
          echo "PASS: refused inside the root, allowed outside it"

      - name: census counts a mirrored copy once
        # Two repos holding byte-identical copies of one agent are one asset.
        # Counting the files instead inflates every total the tool reports.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/a/.claude/agents" "$fixture/b/.claude/agents"
          printf -- '---\nname: shared\ndescription: mirrored agent\n---\nbody\n' \
            | tee "$fixture/a/.claude/agents/shared.md" \
            > "$fixture/b/.claude/agents/shared.md"
          printf -- '---\nname: solo\ndescription: only here\n---\nbody\n' \
            > "$fixture/a/.claude/agents/solo.md"
          cat > "$fixture/census.json" <<EOF
          {
            "userRoots": [],
            "projectRoots": ["$fixture/a", "$fixture/b"],
            "excludeOssForks": false
          }
          EOF

          out="$(python3 plugins/census/scripts/census.py --config "$fixture/census.json" catalog)"
          echo "$out"
          if ! grep -qF -- "Assets: 2 (2 agents)" <<<"$out"; then
            echo "FAIL: expected 2 distinct assets from 3 files"
            exit 1
          fi
          if ! grep -qF -- "found in 3 files" <<<"$out"; then
            echo "FAIL: expected the file count to still be reported"
            exit 1
          fi
          echo "PASS: mirrored copy collapsed into one asset"

      - name: census catches an agent bound to its own repo
        # The coupling global markers cannot see: a repo-scoped agent naming its
        # own repo by a relative path, carrying no machine-wide identifier.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/acme-platform/.claude/agents"
          printf -- '---\nname: bound\ndescription: Reviews changes inside acme-platform/storage/.\n---\nbody\n' \
            > "$fixture/acme-platform/.claude/agents/bound.md"
          printf -- '---\nname: free\ndescription: Reviews shell scripts for portability.\n---\nbody\n' \
            > "$fixture/acme-platform/.claude/agents/free.md"
          cat > "$fixture/census.json" <<EOF
          {
            "userRoots": [],
            "projectRoots": ["$fixture/acme-platform"],
            "excludeOssForks": false
          }
          EOF

          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            portability --json > "$fixture/report.json"
          python3 - "$fixture/report.json" <<'PY'
          import json, sys

          report = json.load(open(sys.argv[1]))
          tier = {i["name"]: i["tier"] for i in report["items"]}
          failures = []
          if tier.get("bound") != "PERSONAL":
              failures.append(f"bound: expected PERSONAL, got {tier.get('bound')!r}")
          if tier.get("free") != "PORTABLE":
              failures.append(f"free: expected PORTABLE, got {tier.get('free')!r}")
          if "acme-platform" not in report.get("scopedMarkers", []):
              failures.append("acme-platform missing from scopedMarkers")

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: repo-scoped coupling detected without false-positiving a generic agent"

      - name: census reads a hook through the script it runs
        # A hook is a pointer. Its coupling lives in the target script, and its
        # worst failure is that the target is not there at all.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/hooks"
          printf '#!/usr/bin/env bash\ntest -d "$HOME/AcmeVault" && exit 1\n' \
            > "$fixture/home/.claude/hooks/present.sh"
          chmod +x "$fixture/home/.claude/hooks/present.sh"
          cat > "$fixture/home/.claude/settings.json" <<EOF
          {
            "hooks": {
              "PreToolUse": [
                {
                  "matcher": "Bash",
                  "hooks": [
                    {"type": "command", "command": "$fixture/home/.claude/hooks/present.sh"},
                    {"type": "command", "command": "$fixture/home/.claude/hooks/gone.sh"}
                  ]
                }
              ]
            }
          }
          EOF
          cat > "$fixture/census.json" <<EOF
          {
            "userRoots": ["$fixture/home/.claude"],
            "projectRoots": [],
            "excludeOssForks": false,
            "portability": {"markers": ["AcmeVault"]}
          }
          EOF

          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            drift --json > "$fixture/drift.json"
          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            portability --json > "$fixture/port.json"
          python3 - "$fixture/drift.json" "$fixture/port.json" <<'PY'
          import json, sys

          drift = json.load(open(sys.argv[1]))
          port = json.load(open(sys.argv[2]))
          failures = []

          missing = [f for f in drift["findings"] if f["code"] == "hook-missing-script"]
          if len(missing) != 1:
              failures.append(f"expected 1 hook-missing-script finding, got {len(missing)}")
          elif "gone.sh" not in missing[0]["title"]:
              failures.append(f"wrong hook flagged: {missing[0]['title']}")

          present = next((i for i in port["items"] if i["name"] == "present.sh"), None)
          if present is None:
              failures.append("hook was not graded for portability at all")
          else:
              if present["tier"] != "PARAMETERIZABLE":
                  failures.append(f"present.sh: expected PARAMETERIZABLE, got {present['tier']}")
              if "AcmeVault" not in present["markers"]:
                  failures.append("marker inside the hook script was not found")

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: hook script read for coupling, missing target reported"

      - name: census sees a mirror its source has moved past
        # The drift a shape comparison cannot see and a content comparison must
        # not attempt: a translation is SUPPOSED to read differently, so history
        # is the only honest answer to "did the mirror keep up?".
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/repo/.claude/agents" "$fixture/repo/.claude/agents-ko"
          cd "$fixture/repo"
          git init -q
          git config user.email ci@example.com
          git config user.name ci
          for name in stale fresh; do
            printf -- '---\nname: %s\ndescription: an agent\n---\nbody\n' "$name" \
              > ".claude/agents/$name.md"
            printf -- '---\nname: %s\ndescription: translated\n---\ntranslated body\n' "$name" \
              > ".claude/agents-ko/$name.md"
          done
          git add -A
          GIT_COMMITTER_DATE="2026-01-01T00:00:00" \
            git commit -q --date="2026-01-01T00:00:00" -m init

          # Only the source moves. Both files still have the same shape.
          printf -- '---\nname: stale\ndescription: an agent\n---\nbody, revised\n' \
            > .claude/agents/stale.md
          git add -A
          GIT_COMMITTER_DATE="2026-03-01T00:00:00" \
            git commit -q --date="2026-03-01T00:00:00" -m "revise source only"

          cd "$GITHUB_WORKSPACE"
          cat > "$fixture/census.json" <<EOF
          {
            "userRoots": [],
            "projectRoots": ["$fixture/repo"],
            "excludeOssForks": false,
            "pairs": {"agents": "agents-ko"}
          }
          EOF

          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            drift --json > "$fixture/drift.json"
          python3 - "$fixture/drift.json" <<'PY'
          import json, sys

          findings = json.load(open(sys.argv[1]))["findings"]
          stale = [f for f in findings if f["code"] == "pair-stale"]
          failures = []

          if len(stale) != 1:
              failures.append(f"expected 1 pair-stale finding, got {len(stale)}")
          elif "`stale`" not in stale[0]["title"]:
              failures.append(f"wrong pair flagged: {stale[0]['title']}")

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: stale mirror caught, co-committed pair left alone"

      - name: census tells an inline-shell hook from a missing script
        # A hook command need not run a script at all. Resolving its first word
        # as a path regardless invents a file nobody meant to exist and reports
        # every such hook as broken — burying the one hook that really is. The
        # same first-word assumption misses the script behind an interpreter.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/hooks"
          printf '#!/usr/bin/env python3\nprint("guard")\n' \
            > "$fixture/home/.claude/hooks/guard.py"
          cat > "$fixture/home/.claude/settings.json" <<EOF
          {
            "hooks": {
              "PreToolUse": [
                {
                  "matcher": "Bash",
                  "hooks": [
                    {"type": "command", "command": "echo inline-shell-guard"},
                    {"type": "command", "command": "jq -r .tool_name"},
                    {"type": "command", "command": "python3 $fixture/home/.claude/hooks/guard.py --strict"},
                    {"type": "command", "command": "$fixture/home/.claude/hooks/gone.sh"}
                  ]
                }
              ]
            }
          }
          EOF
          cat > "$fixture/census.json" <<EOF
          {
            "userRoots": ["$fixture/home/.claude"],
            "projectRoots": [],
            "excludeOssForks": false
          }
          EOF

          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            drift --json > "$fixture/drift.json"
          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            scan > "$fixture/scan.json"
          python3 - "$fixture/drift.json" "$fixture/scan.json" <<'PY'
          import json, sys

          drift = json.load(open(sys.argv[1]))
          hooks = {h["name"]: h for h in json.load(open(sys.argv[2]))["items"]
                   if h["kind"] == "hook"}
          failures = []

          # Every registration is still catalogued; only the verdict changed.
          if len(hooks) != 4:
              failures.append(f"expected 4 hook registrations, got {sorted(hooks)}")

          for inline in ("echo", "jq"):
              hook = hooks.get(inline)
              if hook is None:
                  failures.append(f"{inline}: inline-shell hook was dropped entirely")
              elif hook["script"] is not None:
                  failures.append(f"{inline}: resolved a script it never had: {hook['script']}")

          behind = hooks.get("guard.py")
          if behind is None:
              failures.append("script behind an interpreter prefix was not found")
          elif not behind["scriptExists"]:
              failures.append(f"guard.py resolved to a missing file: {behind['script']}")

          missing = [f for f in drift["findings"] if f["code"] == "hook-missing-script"]
          if len(missing) != 1:
              failures.append(
                  f"expected exactly 1 hook-missing-script, got "
                  f"{[f['title'] for f in missing]}"
              )
          elif "gone.sh" not in missing[0]["title"]:
              failures.append(f"wrong hook flagged: {missing[0]['title']}")

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: inline shell left alone, interpreter prefix followed, real gap reported"

      - name: census survives a malformed config
        # census reads config it did not write, in files whose shape nothing
        # validates. One hand-edited settings.json in an unexpected shape must
        # not take down the audit of every other root along with it.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/agents"
          printf -- '---\nname: alpha\ndescription: an agent\n---\nbody\n' \
            > "$fixture/home/.claude/agents/alpha.md"
          cat > "$fixture/census.json" <<EOF
          {
            "userRoots": ["$fixture/home/.claude"],
            "projectRoots": [],
            "excludeOssForks": false,
            "portability": []
          }
          EOF

          for shape in \
            '{"hooks": {"PreToolUse": "not-a-list"}}' \
            '{"hooks": {"PreToolUse": [{"hooks": "not-a-list"}]}}' \
            '{"hooks": {"PreToolUse": [{"hooks": ["not-an-object"]}]}}' \
            '{"hooks": [1, 2]}' \
            '{"hooks": {"PreToolUse": [{"matcher": 5, "hooks": [{"command": 123}]}]}}'
          do
            echo "$shape" > "$fixture/home/.claude/settings.json"
            for command in catalog drift portability; do
              if ! out="$(python3 plugins/census/scripts/census.py \
                   --config "$fixture/census.json" "$command" 2>&1)"; then
                echo "FAIL: $command aborted on settings.json shape $shape"
                echo "$out" | tail -3
                exit 1
              fi
            done
            # The agent alongside the broken file must still be found.
            if ! grep -qF -- '`alpha`' <<<"$out"; then
              echo "FAIL: a malformed settings.json suppressed the rest of the root"
              exit 1
            fi
          done
          echo "PASS: malformed shapes skipped, surrounding config still audited"

      - name: census does not invent translation mirrors by default
        # Keeping `-ko` mirrors is one workflow among many. A default that
        # assumes it reports a missing mirror for every item belonging to
        # everyone who does not, burying the findings worth reading under a wall
        # of red on the very first run. Opting in must still switch it back on.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/agents" "$fixture/home/.claude/agents-ko"
          for name in alpha beta; do
            printf -- '---\nname: %s\ndescription: an agent\n---\nbody\n' "$name" \
              > "$fixture/home/.claude/agents/$name.md"
          done
          # Only `alpha` has a mirror, so opting in must report exactly one gap.
          printf -- '---\nname: alpha\ndescription: translated\n---\nbody\n' \
            > "$fixture/home/.claude/agents-ko/alpha.md"

          emit() {
            cat > "$fixture/census.json" <<EOF
          {
            "userRoots": ["$fixture/home/.claude"],
            "projectRoots": [],
            "excludeOssForks": false$1
          }
          EOF
          }

          emit ""
          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            drift --json > "$fixture/default.json"
          emit ', "pairs": {"agents": "agents-ko"}'
          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            drift --json > "$fixture/opted-in.json"

          python3 - "$fixture/default.json" "$fixture/opted-in.json" <<'PY'
          import json, sys

          def pair_gaps(path):
              findings = json.load(open(path))["findings"]
              return [f for f in findings if f["code"] == "pair-missing"]

          failures = []
          default = pair_gaps(sys.argv[1])
          if default:
              failures.append(
                  f"default config invented {len(default)} missing mirrors: "
                  f"{[f['title'] for f in default]}"
              )

          opted = pair_gaps(sys.argv[2])
          if len(opted) != 1:
              failures.append(f"opting in should report 1 gap, got {[f['title'] for f in opted]}")
          elif "`beta`" not in opted[0]["title"]:
              failures.append(f"wrong item flagged: {opted[0]['title']}")

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: silent by default, still reports the real gap when opted in"

      - name: census grades a user-level item by the repos it names
        # A user-level item belongs to no repo, so repo-scoped markers never
        # reach it — and those are exactly the items written about a named
        # handful of repos. Deleting the path prefix would otherwise be enough
        # to score a perfect 🟢 while the item stays useless to anyone else.
        # The repos need not carry .claude/ themselves; existing is enough.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/agents" \
                   "$fixture/code/acme-billing-api" \
                   "$fixture/code/docs" \
                   "$fixture/code/carrier/.claude/agents"
          printf -- '---\nname: bound\ndescription: Runs the migration suite for acme-billing-api.\n---\nbody\n' \
            > "$fixture/home/.claude/agents/bound.md"
          printf -- '---\nname: free\ndescription: Reviews shell scripts for portability.\n---\nRefer to the docs when unsure.\n' \
            > "$fixture/home/.claude/agents/free.md"
          printf -- '---\nname: local\ndescription: A repo-scoped agent.\n---\nbody\n' \
            > "$fixture/code/carrier/.claude/agents/local.md"
          cat > "$fixture/census.json" <<EOF
          {
            "userRoots": ["$fixture/home/.claude"],
            "projectRoots": ["$fixture/code/*"],
            "excludeOssForks": false,
            "pairs": {}
          }
          EOF

          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            portability --json > "$fixture/port.json"
          python3 - "$fixture/port.json" <<'PY'
          import json, sys

          report = json.load(open(sys.argv[1]))
          tier = {i["name"]: i for i in report["items"]}
          failures = []

          bound = tier.get("bound")
          if bound is None:
              failures.append("the bound agent was not graded at all")
          else:
              if bound["tier"] != "PERSONAL":
                  failures.append(f"bound: expected PERSONAL, got {bound['tier']}")
              if "acme-billing-api" not in bound["markers"]:
                  failures.append(f"bound: repo name not matched, markers={bound['markers']}")

          # `docs` is a real directory here. A single-word repo name is also an
          # ordinary word, and matching it would fire on the prose in `free`.
          free = tier.get("free")
          if free is None:
              failures.append("the free agent was not graded at all")
          elif free["tier"] != "PORTABLE":
              failures.append(f"free: expected PORTABLE, got {free['tier']} ({free['markers']})")
          if "docs" in report.get("namedRepoMarkers", []):
              failures.append("a single-word repo name became a marker — generic-word trap")

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: named repo caught, single-word repo name left alone"

      - name: census reports a portable item blocked by its dependency
        # A wrapper whose whole body is "delegate to X" carries no marker and
        # grades 🟢 on its own contents. Shipping it without X publishes a name
        # that resolves to nothing, so 🟢 alone must not read as share-ready.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/agents" "$fixture/home/.claude/commands" \
                   "$fixture/code/acme-billing-api"
          printf -- '---\nname: bound-helper\ndescription: Reviews acme-billing-api migrations.\n---\nbody\n' \
            > "$fixture/home/.claude/agents/bound-helper.md"
          printf -- '---\nname: free-helper\ndescription: Reviews shell scripts.\n---\nbody\n' \
            > "$fixture/home/.claude/agents/free-helper.md"
          printf -- '---\nname: wrapper\ndescription: Thin wrapper.\n---\nDelegate to `bound-helper` for the review.\n' \
            > "$fixture/home/.claude/commands/wrapper.md"
          printf -- '---\nname: clean\ndescription: Thin wrapper.\n---\nDelegate to `free-helper` for the review.\n' \
            > "$fixture/home/.claude/commands/clean.md"
          cat > "$fixture/census.json" <<EOF
          {
            "userRoots": ["$fixture/home/.claude"],
            "projectRoots": ["$fixture/code/*"],
            "excludeOssForks": false,
            "pairs": {}
          }
          EOF

          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            portability --json > "$fixture/port.json"
          python3 - "$fixture/port.json" <<'PY'
          import json, sys

          report = json.load(open(sys.argv[1]))
          items = {i["name"]: i for i in report["items"]}
          failures = []

          # .get() throughout: a build that predates the dependency axis has no
          # such keys, and "the field is missing" is the finding — worth saying
          # in one line rather than as a KeyError traceback.
          wrapper = items.get("wrapper")
          if wrapper is None:
              failures.append("wrapper was not graded")
          else:
              if wrapper.get("tier") != "PORTABLE":
                  failures.append(f"wrapper: own contents should grade PORTABLE, got {wrapper.get('tier')}")
              if wrapper.get("blockedBy") != ["bound-helper"]:
                  failures.append(f"wrapper: expected blockedBy [bound-helper], got {wrapper.get('blockedBy')!r}")
              if wrapper.get("shareable", True):
                  failures.append("wrapper: counted as share-ready despite a blocked dependency")

          clean = items.get("clean")
          if clean is None:
              failures.append("clean was not graded")
          else:
              if clean.get("dependsOn") != ["free-helper"]:
                  failures.append(f"clean: dependency not detected, got {clean.get('dependsOn')!r}")
              if not clean.get("shareable", False):
                  failures.append(f"clean: should be share-ready, blockedBy={clean.get('blockedBy')!r}")

          if report.get("blocked") != ["wrapper"]:
              failures.append(f"expected exactly ['wrapper'] blocked, got {report.get('blocked')!r}")

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: blocked wrapper flagged, clean wrapper still share-ready"

      - name: census sees a script an item shells out to
        # The dependency the asset graph cannot name: a helper script is not an
        # agent, command, skill or hook, so nothing in the catalogue represents
        # it. Only scripts that really exist are counted — an example filename
        # in prose, and a sibling merely named in a comment, must stay quiet.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/agents" "$fixture/home/.claude/helpers" \
                   "$fixture/home/.claude/hooks"
          printf '#!/usr/bin/env bash\necho shared\n' > "$fixture/home/.claude/helpers/shared-helper.sh"
          chmod +x "$fixture/home/.claude/helpers/shared-helper.sh"

          printf -- '---\nname: caller\ndescription: Runs the shared helper.\n---\nRun `shared-helper.sh` before reporting.\n' \
            > "$fixture/home/.claude/agents/caller.md"
          # `missing-helper.sh` does not exist anywhere, so it is an example.
          printf -- '---\nname: illustrator\ndescription: Shows example output.\n---\nOutput looks like `missing-helper.sh: 3 issues`.\n' \
            > "$fixture/home/.claude/agents/illustrator.md"

          # A hook that only NAMES a sibling in a comment calls nothing.
          printf '#!/usr/bin/env bash\n# sibling of shared-helper.sh, which it does not run\nexit 0\n' \
            > "$fixture/home/.claude/hooks/commenter.sh"
          chmod +x "$fixture/home/.claude/hooks/commenter.sh"
          cat > "$fixture/home/.claude/settings.json" <<EOF
          {"hooks": {"PreToolUse": [{"matcher": "Bash", "hooks": [
            {"type": "command", "command": "$fixture/home/.claude/hooks/commenter.sh"}]}]}}
          EOF
          cat > "$fixture/census.json" <<EOF
          {
            "userRoots": ["$fixture/home/.claude"],
            "projectRoots": [],
            "excludeOssForks": false,
            "pairs": {}
          }
          EOF

          python3 plugins/census/scripts/census.py --config "$fixture/census.json" \
            portability --json > "$fixture/port.json"
          python3 - "$fixture/port.json" <<'PY'
          import json, sys

          report = json.load(open(sys.argv[1]))
          items = {i["name"]: i for i in report["items"]}
          failures = []

          caller = items.get("caller")
          if caller is None:
              failures.append("caller was not graded")
          else:
              names = [s["name"] for s in caller.get("externalScripts", [])]
              if names != ["shared-helper.sh"]:
                  failures.append(f"caller: expected [shared-helper.sh], got {names!r}")
              if caller.get("shareable", True):
                  failures.append("caller: share-ready despite calling a script it does not carry")

          illustrator = items.get("illustrator")
          if illustrator is None:
              failures.append("illustrator was not graded")
          elif illustrator.get("externalScripts"):
              failures.append(
                  f"illustrator: an example filename was counted: "
                  f"{illustrator['externalScripts']!r}"
              )

          commenter = items.get("commenter.sh")
          if commenter is None:
              failures.append("the hook was not graded")
          elif commenter.get("externalScripts"):
              failures.append(
                  f"commenter.sh: a sibling named only in a comment was counted: "
                  f"{commenter['externalScripts']!r}"
              )

          if report.get("callsScripts") != ["caller"]:
              failures.append(f"expected exactly ['caller'], got {report.get('callsScripts')!r}")

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: real call flagged, example and comment left alone"

      - name: atlas maps all four layers
        # The whole premise is that a session resolves user, project and plugin
        # config at once and nothing shows them together. If any one layer stops
        # being collected, the map is quietly wrong rather than obviously broken.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/agents" \
                   "$fixture/home/.claude/commands/git" \
                   "$fixture/home/.claude/skills/tidy" \
                   "$fixture/home/.claude/plugins" \
                   "$fixture/repo/.claude/commands" \
                   "$fixture/plug/commands" \
                   "$fixture/plug/skills/demo" \
                   "$fixture/plug/.claude-plugin"
          printf -- '---\nname: reviewer\ndescription: A user agent\n---\nbody\n' \
            > "$fixture/home/.claude/agents/reviewer.md"
          printf -- '---\ndescription: Ships it\n---\nbody\n' \
            > "$fixture/home/.claude/commands/git/ship.md"
          printf -- '---\nname: tidy\ndescription: Tidies up\n---\nbody\n' \
            > "$fixture/home/.claude/skills/tidy/SKILL.md"
          printf '# Global memory\n' > "$fixture/home/.claude/CLAUDE.md"
          printf -- '---\n---\nno description\n' > "$fixture/repo/.claude/commands/nodesc.md"
          printf -- '---\ndescription: A plugin command\n---\nbody\n' \
            > "$fixture/plug/commands/ship.md"
          printf -- '---\nname: demo\ndescription: A plugin skill\n---\nbody\n' \
            > "$fixture/plug/skills/demo/SKILL.md"
          printf '{"name":"demoplug","version":"1.2.3","description":"a demo plugin"}' \
            > "$fixture/plug/.claude-plugin/plugin.json"
          cat > "$fixture/home/.claude/plugins/installed_plugins.json" <<EOF
          {"version":2,"plugins":{"demoplug@acme":[
            {"scope":"user","installPath":"$fixture/plug","version":"1.2.3"}]}}
          EOF

          python3 plugins/atlas/scripts/atlas.py --project "$fixture/repo" \
            --user-root "$fixture/home/.claude" scan > "$fixture/graph.json"
          python3 - "$fixture/graph.json" <<'PY'
          import json, sys

          graph = json.load(open(sys.argv[1]))
          items = graph["items"]
          failures = []

          layers = {i["layer"] for i in items}
          for layer in ("user", "project", "plugin"):
              if layer not in layers:
                  failures.append(f"nothing collected from the {layer} layer")

          def one(kind, name):
              hits = [i for i in items if i["kind"] == kind and i["name"] == name]
              if len(hits) != 1:
                  failures.append(f"expected exactly one {kind} named {name!r}, got {len(hits)}")
                  return None
              return hits[0]

          # A subdirectory namespaces a command, and the map must report the
          # name actually typed rather than the file stem.
          nested = one("command", "git:ship")
          if nested and nested["invocation"] != "/git:ship":
              failures.append(f"nested command invocation is {nested['invocation']!r}")

          # A plugin's command carries its plugin namespace, which is exactly
          # why it can never collide with the user's own.
          plugged = one("command", "ship")
          if plugged and plugged["invocation"] != "/demoplug:ship":
              failures.append(f"plugin command invocation is {plugged['invocation']!r}")

          skill = one("skill", "demo")
          if skill and skill["invocation"] != "/demoplug:demo":
              failures.append(f"plugin skill invocation is {skill['invocation']!r}")

          if not any(i["kind"] == "memory" for i in items):
              failures.append("CLAUDE.md was not collected")
          if graph["stats"]["missingDescriptions"] != 1:
              failures.append(
                  f"expected 1 item with no description, got "
                  f"{graph['stats']['missingDescriptions']}"
              )

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: user, project and plugin layers all collected with the right invocations"

      - name: atlas names the definition that wins
        # An agent name defined at both user and project level resolves
        # differently depending on where the session started, and nothing else
        # reports which copy answered.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/agents" "$fixture/repo/.claude/agents"
          printf -- '---\nname: reviewer\ndescription: The user copy\n---\nbody\n' \
            > "$fixture/home/.claude/agents/reviewer.md"
          printf -- '---\nname: reviewer\ndescription: The project copy\n---\nother body\n' \
            > "$fixture/repo/.claude/agents/reviewer.md"
          printf -- '---\nname: solo\ndescription: Only here\n---\nbody\n' \
            > "$fixture/repo/.claude/agents/solo.md"

          python3 plugins/atlas/scripts/atlas.py --project "$fixture/repo" \
            --user-root "$fixture/home/.claude" scan > "$fixture/graph.json"
          python3 - "$fixture/graph.json" <<'PY'
          import json, sys

          graph = json.load(open(sys.argv[1]))
          failures = []

          conflicts = graph["conflicts"]
          if len(conflicts) != 1:
              failures.append(f"expected 1 conflict, got {len(conflicts)}")
          else:
              conflict = conflicts[0]
              if conflict["name"] != "reviewer":
                  failures.append(f"wrong name flagged: {conflict['name']!r}")
              if "project" not in conflict["verdict"]:
                  failures.append(f"winner not named: {conflict['verdict']!r}")
              if len(conflict["where"]) != 2:
                  failures.append(f"expected 2 origins, got {len(conflict['where'])}")

          solo = next(i for i in graph["items"] if i["name"] == "solo")
          if solo.get("conflicted"):
              failures.append("an agent defined once was reported as shadowed")

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: the shadowed name is reported and the winner is named"

      - name: atlas tells an inline hook from a missing script
        # A hook registration is a pointer, and its quietest failure is that the
        # target is gone: it loads, never fires, and says nothing. An inline
        # one-liner has no file to find and must not be reported as broken.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/hooks" "$fixture/repo"
          printf '#!/usr/bin/env bash\ntrue\n' > "$fixture/home/.claude/hooks/present.sh"
          chmod +x "$fixture/home/.claude/hooks/present.sh"
          cat > "$fixture/home/.claude/settings.json" <<EOF
          {"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[
            {"type":"command","command":"$fixture/home/.claude/hooks/present.sh"},
            {"type":"command","command":"$fixture/home/.claude/hooks/gone.sh"},
            {"type":"command","command":"jq -r .tool_name"}]}]}}
          EOF

          python3 plugins/atlas/scripts/atlas.py --project "$fixture/repo" \
            --user-root "$fixture/home/.claude" scan > "$fixture/graph.json"
          python3 - "$fixture/graph.json" <<'PY'
          import json, sys

          graph = json.load(open(sys.argv[1]))
          hooks = {i["name"]: i for i in graph["items"] if i["kind"] == "hook"}
          failures = []

          if len(hooks) != 3:
              failures.append(f"expected 3 hooks, got {sorted(hooks)}")
          if hooks.get("present.sh", {}).get("resolves") is not True:
              failures.append("a hook whose script exists was reported as missing")
          if hooks.get("gone.sh", {}).get("resolves") is not False:
              failures.append("a hook pointing at a deleted script was not flagged")
          if hooks.get("jq", {}).get("resolves") is not True:
              failures.append("an inline hook was reported as a missing script")
          if graph["stats"]["unresolvedHooks"] != 1:
              failures.append(f"unresolvedHooks is {graph['stats']['unresolvedHooks']}")

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: missing script flagged, inline hook left alone"

      - name: atlas ships a self-contained viewer that leaks no MCP values
        # Two promises the README makes, both of which are only real if they are
        # exercised: the page makes no network request, and an MCP server's env
        # block is reported by variable NAME and never by value.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude" "$fixture/repo"
          cat > "$fixture/repo/.mcp.json" <<'EOF'
          {"mcpServers":{"gh":{"command":"npx","args":["-y","gh-mcp"],
            "env":{"GH_TOKEN":"do-not-ship-this"}}}}
          EOF

          python3 plugins/atlas/scripts/atlas.py --project "$fixture/repo" \
            --user-root "$fixture/home/.claude" view --out "$fixture/out.html"
          test -s "$fixture/out.html"

          if grep -qF 'do-not-ship-this' "$fixture/out.html"; then
            echo "FAIL: an MCP env VALUE reached the viewer"
            exit 1
          fi
          if ! grep -qF 'GH_TOKEN' "$fixture/out.html"; then
            echo "FAIL: the MCP env variable name was not reported at all"
            exit 1
          fi
          # A strict CSP is not available for a file:// page, so the guarantee
          # has to be that no external reference is emitted in the first place.
          if grep -qE '<script[^>]+src=|<link |@import|url\(' "$fixture/out.html"; then
            echo "FAIL: the viewer references something outside itself"
            grep -nE '<script[^>]+src=|<link |@import|url\(' "$fixture/out.html" | head
            exit 1
          fi
          echo "PASS: no external reference, env reported by name only"

      - name: atlas pairs a translation mirror without counting it twice
        # Only the source directory is loaded by Claude Code, so a mirror is a
        # reading language rather than another agent. Counting it would inflate
        # both the resource total and the always-on context figure.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/agents" "$fixture/home/.claude/agents-ko" \
                   "$fixture/home/.claude/skills/tidy" "$fixture/home/.claude/skills-ko/tidy" \
                   "$fixture/repo"
          printf -- '---\nname: reviewer\ndescription: Reviews things.\n---\nsource body\n' \
            > "$fixture/home/.claude/agents/reviewer.md"
          # The mirror translates the name too — pairing must still work, which
          # is why it is done by path and never by the name field.
          printf -- '---\nname: 리뷰어\ndescription: 이것저것 검토합니다.\n---\n번역된 본문\n' \
            > "$fixture/home/.claude/agents-ko/reviewer.md"
          printf -- '---\nname: lonely\ndescription: Has no mirror.\n---\nbody\n' \
            > "$fixture/home/.claude/agents/lonely.md"
          printf -- '---\nname: tidy\ndescription: Tidies up.\n---\nbody\n' \
            > "$fixture/home/.claude/skills/tidy/SKILL.md"
          printf -- '---\nname: tidy\ndescription: 정리합니다.\n---\n본문\n' \
            > "$fixture/home/.claude/skills-ko/tidy/SKILL.md"

          python3 plugins/atlas/scripts/atlas.py --project "$fixture/repo" \
            --user-root "$fixture/home/.claude" scan > "$fixture/graph.json"
          python3 - "$fixture/graph.json" <<'PY'
          import json, sys

          graph = json.load(open(sys.argv[1]))
          items = {(i["kind"], i["name"]): i for i in graph["items"]}
          failures = []

          if graph["languages"] != ["ko"]:
              failures.append(f"languages is {graph['languages']!r}")

          agents = [i for i in graph["items"] if i["kind"] == "agent"]
          if len(agents) != 2:
              failures.append(f"expected 2 agents, got {[a['name'] for a in agents]}")
          if any(a["name"] == "리뷰어" for a in agents):
              failures.append("the mirror was collected as its own agent")

          reviewer = items.get(("agent", "reviewer"))
          if reviewer is None:
              failures.append("reviewer missing")
          elif reviewer["translations"].get("ko", {}).get("description") != "이것저것 검토합니다.":
              failures.append(f"reviewer ko translation not paired: {reviewer['translations']!r}")

          skill = items.get(("skill", "tidy"))
          if skill is None or "ko" not in skill["translations"]:
              failures.append("the skill mirror was not paired")

          lonely = items.get(("agent", "lonely"))
          if lonely is None:
              failures.append("lonely missing")
          else:
              if lonely["translations"]:
                  failures.append("an item with no mirror was given one")
              # A gap is only a gap where mirrors are kept at all.
              if "ko" not in lonely.get("mirrorLangs", []):
                  failures.append("a missing mirror in a mirrored directory was not flaggable")

          # The mirror must not be charged for: only the source description is
          # resident, so the total is the two source descriptions plus the skill.
          expected = sum(
              len(i["name"]) + len(i["description"])
              for i in graph["items"] if i["kind"] in ("agent", "skill")
          )
          if graph["stats"]["residentChars"] != expected:
              failures.append(
                  f"residentChars {graph['stats']['residentChars']} != {expected} "
                  "— a translation was counted as always-on context"
              )

          for line in failures:
              print(f"FAIL: {line}")
          sys.exit(1 if failures else 0)
          PY
          echo "PASS: mirror paired by path, not counted, not charged for"

      - name: atlas refuses to write into a scanned tree
        # A tool that reports on your config must not become part of what it
        # reports — and a viewer committed by accident names real paths.
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/home/.claude/agents" "$fixture/repo/.claude"
          printf -- '---\nname: alpha\ndescription: an agent\n---\nbody\n' \
            > "$fixture/home/.claude/agents/alpha.md"

          if python3 plugins/atlas/scripts/atlas.py --project "$fixture/repo" \
               --user-root "$fixture/home/.claude" \
               view --out "$fixture/home/.claude/atlas.html"; then
            echo "FAIL: wrote the viewer inside the scanned config root"
            exit 1
          fi
          if [ -e "$fixture/home/.claude/atlas.html" ]; then
            echo "FAIL: refused but the file exists anyway"
            exit 1
          fi
          python3 plugins/atlas/scripts/atlas.py --project "$fixture/repo" \
            --user-root "$fixture/home/.claude" view --out "$fixture/outside.html"
          test -s "$fixture/outside.html"
          echo "PASS: refused inside the root, allowed outside it"

  ci-result:
    name: CI Result
    if: always()
    needs: [manifests, consistency, scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "[FAIL] Some jobs failed or were cancelled"
            exit 1
          fi
          echo "[PASS] All CI jobs passed"
