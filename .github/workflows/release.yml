name: Create release

# Tags are per plugin — `<plugin>-v<X.Y.Z>`, e.g. `census-v0.3.1`. A marketplace
# holds plugins that version independently, so a repo-wide tag would force every
# plugin's version up whenever any one of them shipped. Tags of the retired
# repo-wide form (`v0.3.0` and earlier) stay in history and are not rebuilt.
on:
  push:
    tags:
      - "*-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    steps:
      - name: "Check-out"
        uses: actions/checkout@v7
        with:
          # git-cliff walks the full history to build the changelog.
          fetch-depth: 0

      - name: Resolve plugin and version from the tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          PLUGIN="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if [ ! -f "plugins/${PLUGIN}/.claude-plugin/plugin.json" ]; then
            echo "FAIL: tag names plugin '${PLUGIN}', which has no manifest" >&2
            exit 1
          fi
          echo "plugin=${PLUGIN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get this plugin's previous tag
        id: prev_tag
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ github.ref_name }}"
          PLUGIN="${{ steps.tag.outputs.plugin }}"
          PREVIOUS_TAG=$(git tag -l "${PLUGIN}-v[0-9]*.[0-9]*.[0-9]*" | sort -V \
            | grep -B1 "^${CURRENT_TAG}$" | head -n1)
          if [ "$PREVIOUS_TAG" = "$CURRENT_TAG" ]; then
            PREVIOUS_TAG=""
          fi
          echo "tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog with git-cliff
        # Scoped twice: --tag-pattern picks the version range from THIS plugin's
        # tags, --include-path drops commits that touched a different plugin.
        # Allowed to fail — a release whose commits all landed outside this
        # plugin leaves git-cliff with nothing to render, which is not an error.
        continue-on-error: true
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            --tag-pattern "^${{ steps.tag.outputs.plugin }}-v"
            --include-path "plugins/${{ steps.tag.outputs.plugin }}/**"
            --latest --strip header
        env:
          OUTPUT: RELEASE.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble release notes
        run: |
          set -euo pipefail
          if [ ! -s RELEASE.md ]; then
            echo "No changes recorded under plugins/${{ steps.tag.outputs.plugin }}/." > RELEASE.md
          fi
          if [ -n "${{ steps.prev_tag.outputs.tag }}" ]; then
            echo "" >> RELEASE.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.tag }}...${{ github.ref_name }}" >> RELEASE.md
          fi

      - name: "Create GitHub release"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ steps.tag.outputs.plugin }} ${{ steps.tag.outputs.version }}"
          body_path: RELEASE.md
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

# No major-tag-action here, unlike the composite-action repos. A sliding `v1`
# exists so action consumers can write `uses: somaz94/<action>@v1`. Plugin
# consumers never resolve a git tag: `/plugin install census@somaz94` reads
# .claude-plugin/marketplace.json, and pinning is the `version` field there.
# A sliding major tag would be inert.
